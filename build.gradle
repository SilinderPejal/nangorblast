
plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.googlecode.lanterna:lanterna:3.1.2'
}

application {
    mainClass = 'nangor_blast.Main'
}

jar {
    archiveFileName = 'NangorBlast.jar'
    destinationDirectory = file("$projectDir")
}

shadowJar {
    archiveFileName = 'NangorBlast-all.jar'
    destinationDirectory = file("$projectDir")

    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/main/assets'
        }
    }
}